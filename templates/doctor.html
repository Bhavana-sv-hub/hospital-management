
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doctor Registration | HMS</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <nav class="navbar">
        <div class="logo">🏥 HMS</div>
        <ul class="nav-links">
            <li><a href="/">Home</a></li>
            <li><a href="/doctors">View Doctors</a></li>
        </ul>
    </nav>

    <div class="page-container">
        <div class="form-card">

            <h1>Doctor Registration</h1>

            <p class="form-subtitle">
                Add a new doctor to the hospital
            </p>

            <form action="/add_doctor" method="POST">

                <div class="form-grid">

                    <div class="form-group">
                        <label>Doctor Name</label>
                        <input type="text" name="name"
                               placeholder="Enter doctor name" required>
                    </div>

                    <div class="form-group">
                        <label>Specialization</label>
                        <input type="text" name="specialization"
                               placeholder="e.g. Cardiologist" required>
                    </div>

                    <div class="form-group">
                        <label>Phone Number</label>
                        <input type="tel" name="phone"
                               placeholder="Enter phone number" required>
                    </div>

                    <div class="form-group">
                        <label>Email Address</label>
                        <input type="email" name="email"
                               placeholder="Enter email address" required>
                    </div>

                </div>

                <button type="submit" class="submit-btn">
                    Add Doctor
                </button>

            </form>
            <a href="{{ url_for('view_doctors') }}">View Doctors</a>
            <a href="/" class="back-link">← Back to Home</a>

        </div>
    </div>

    <footer>Hospital Management System</footer>

</body>
</html>
