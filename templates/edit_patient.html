
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Patient | HMS</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <nav class="navbar">
        <div class="logo">🏥 HMS</div>

        <ul class="nav-links">
            <li><a href="/">Home</a></li>
            <li><a href="/patients">Patients</a></li>
        </ul>
    </nav>

    <div class="page-container">

        <div class="form-card">

            <h1>Edit Patient Details</h1>

            <p class="form-subtitle">
                Update patient information
            </p>

            <form method="POST">

                <label>Patient Name</label>
                <input type="text" name="name"
                       value="{{ patient.name }}" required>

                <label>Age</label>
                <input type="number" name="age"
                       value="{{ patient.age }}" required>

                <label>Gender</label>
                <select name="gender" required>
                    <option value="Male"
                        {% if patient.gender == 'Male' %}selected{% endif %}>
                        Male
                    </option>

                    <option value="Female"
                        {% if patient.gender == 'Female' %}selected{% endif %}>
                        Female
                    </option>

                    <option value="Other"
                        {% if patient.gender == 'Other' %}selected{% endif %}>
                        Other
                    </option>
                </select>

                <label>Phone Number</label>
                <input type="tel" name="phone"
                       value="{{ patient.phone }}" required>

                <label>Address</label>
                <textarea name="address" required>{{ patient.address }}</textarea>

                <button type="submit" class="submit-btn">
                    Update Patient
                </button>

            </form>

            <a href="/patients" class="back-link">
                ← Back to Patients
            </a>

        </div>

    </div>

</body>
</html>
